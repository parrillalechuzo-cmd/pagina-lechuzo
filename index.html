<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Color de la interfaz del navegador en móviles -->
<meta name="theme-color" content="#000000">
    <title>Parrilla El Lechuzo</title>

    <!-- Favicon / Icono de pestaña -->
<link rel="icon" type="image/png" href="assets/img/logo.png">
<link rel="apple-touch-icon" href="assets/img/logo.png">
    <!-- Font Awesome para los iconos profesionales -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <!-- Fuente Inter con variaciones -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    
</head>
<body>

    <!-- Video de fondo con fuego y carne en la parrilla -->
    <video autoplay muted loop playsinline preload="auto" poster="assets/img/fondo-poster.jpg" class="video-background">
    <source src="assets/video/tu-video-fuego.mp4" type="video/mp4">
</video>
    <div class="video-overlay"></div>

    <div class="link-container">
        
        <!-- Información principal de la Marca -->
        <div class="profile-section">
            <div class="avatar-wrapper" title="Parrilla El Lechuzo">
                <!-- Tu logo original conservado intacto -->
            <img src="assets/img/logo.png" alt="Parrilla El Lechuzo Logo" class="avatar-img">  
            </div>
            
            <h1 class="business-title">Parrilla el leChuzo</h1>
            
            <p class="business-bio">
                En Parrillada El Lechuzo 🔥 mantenemos viva la tradición del asado al carbón.
            </p>

            <!-- Redes sociales superiores con efecto hover al color del menú -->
            <div class="social-icons-row">
                <a href="https://www.instagram.com/parrilla_lechuzo" target="_blank" class="social-icon-link" title="Síguenos en Instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>
                <a href="https://wa.me/5211234567890" target="_blank" class="social-icon-link" title="Escríbenos por WhatsApp">
                    <i class="fa-brands fa-whatsapp"></i>
                </a>
                <a href="https://www.facebook.com/profile.php?id=61585726905121" target="_blank" class="social-icon-link" title="Visita nuestro Facebook">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>
            </div>
        </div>

        <!-- Botón del Menú Digital con el color exacto solicitado -->
        <div class="links-list">
            <a href="https://sitio-parrilla-lechuzo.vercel.app/" target="_blank" class="link-btn">
                <div class="btn-icon-left">
                    <i class="fa-solid fa-utensils"></i>
                </div>
                <span class="btn-text">Parrilla El Lechuzo - Menú</span>
                <i class="fa-solid fa-ellipsis-vertical btn-dots"></i>
            </a>

            <!-- En tu index.html dentro de class="links-list" -->
<a href="https://maps.google.com/?q=Parrilla+El+Lechuzo" target="_blank" rel="noopener noreferrer" class="link-btn link-btn-secondary">
    <div class="btn-icon-left">
        <i class="fa-solid fa-location-dot"></i>
    </div>
    <span class="btn-text">¿Cómo llegar? • Ubicación</span>
    <i class="fa-solid fa-chevron-right btn-dots" aria-hidden="true"></i>
</a>
        </div>

        <footer class="footer">
            <p>© Parrilla El Lechuzo • El auténtico sabor al carbón</p>
        </footer>

    </div>

</body>
</html>
